repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: ty
        name: ty
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: unittest
        name: Python unit tests
        entry: python -m unittest lib.utils_test
        language: system
        types: [python]
        pass_filenames: false
